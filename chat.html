<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAVOC — Chat</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #080808; font-family: 'Inter', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; height: 100vh; display: flex; flex-direction: column; }
.nav { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px; border-bottom: 1px solid rgba(255,255,255,0.07); flex-shrink: 0; }
.nav-left { display: flex; align-items: center; gap: 14px; }
.back-btn { color: rgba(255,255,255,0.4); text-decoration: none; font-size: 13px; display: flex; align-items: center; gap: 6px; }
.nav-logo { font-size: 18px; font-weight: 800; letter-spacing: 0.25em; color: #fff; border: 2px solid #fff; padding: 3px 10px; line-height: 1; text-decoration: none; }
.booking-info { font-size: 12px; color: rgba(255,255,255,0.4); }
.booking-type { font-size: 13px; font-weight: 700; color: #fff; }

.chat-container { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.messages { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
.message { display: flex; flex-direction: column; max-width: 70%; }
.message.mine { align-self: flex-end; align-items: flex-end; }
.message.theirs { align-self: flex-start; align-items: flex-start; }
.msg-bubble { padding: 12px 16px; font-size: 13px; line-height: 1.5; border-radius: 2px; }
.message.mine .msg-bubble { background: #fff; color: #080808; }
.message.theirs .msg-bubble { background: #1a1a1a; color: #fff; border: 1px solid rgba(255,255,255,0.08); }
.msg-time { font-size: 10px; color: rgba(255,255,255,0.25); margin-top: 4px; }
.msg-sender { font-size: 10px; font-weight: 600; color: rgba(255,255,255,0.35); margin-bottom: 4px; letter-spacing: 0.06em; text-transform: uppercase; }

.system-msg { align-self: center; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.07); padding: 8px 16px; font-size: 11px; color: rgba(255,255,255,0.35); text-align: center; border-radius: 2px; }

.input-area { border-top: 1px solid rgba(255,255,255,0.07); padding: 16px 24px; display: flex; gap: 12px; align-items: flex-end; flex-shrink: 0; }
.msg-input { flex: 1; background: #141414; border: 1px solid rgba(255,255,255,0.1); color: #fff; font-family: 'Inter', sans-serif; font-size: 13px; padding: 12px 16px; outline: none; resize: none; border-radius: 2px; min-height: 44px; max-height: 120px; transition: border-color 0.2s; }
.msg-input:focus { border-color: rgba(255,255,255,0.3); }
.msg-input::placeholder { color: rgba(255,255,255,0.2); }
.send-btn { background: #fff; color: #080808; border: none; padding: 12px 20px; cursor: pointer; font-family: 'Inter', sans-serif; font-weight: 700; font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0; transition: opacity 0.2s; }
.send-btn:hover { opacity: 0.85; }
.send-btn:disabled { opacity: 0.3; cursor: not-allowed; }

.loading-state { flex: 1; display: flex; align-items: center; justify-content: center; color: rgba(255,255,255,0.25); font-size: 13px; }
</style>
</head>
<body>

<div class="nav">
  <div class="nav-left">
    <a href="javascript:history.back()" class="back-btn"><i class="ti ti-arrow-left"></i> Back</a>
    <a href="/" class="nav-logo">HAVOC</a>
  </div>
  <div style="text-align:right;">
    <div class="booking-type" id="chat-booking-type">Loading...</div>
    <div class="booking-info" id="chat-booking-info"></div>
  </div>
</div>

<div class="chat-container">
  <div class="messages" id="messages">
    <div class="loading-state">Loading messages...</div>
  </div>
  <div class="input-area">
    <textarea class="msg-input" id="msg-input" placeholder="Type a message..." rows="1" onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
    <button class="send-btn" id="send-btn" onclick="sendMessage()"><i class="ti ti-send"></i></button>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCO7B3n_L-hZj9kHAqNTS8gaDFtCRz4ESM",
  authDomain: "havoc-ae499.firebaseapp.com",
  projectId: "havoc-ae499",
  storageBucket: "havoc-ae499.firebasestorage.app",
  messagingSenderId: "233766682734",
  appId: "1:233766682734:web:a4cc2c0542333fb21ca67f",
  measurementId: "G-G20780L1N1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const params = new URLSearchParams(window.location.search);
const bookingId = params.get('booking');

let currentUser = null;
let currentUserName = '';
let unsubscribe = null;

onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = '/auth.html'; return; }
  currentUser = user;
  const uDoc = await getDoc(doc(db, 'users', user.uid));
  currentUserName = uDoc.exists() ? (uDoc.data().name || user.email) : user.email;

  if (!bookingId) {
    document.getElementById('messages').innerHTML = '<div class="loading-state">No booking selected.</div>';
    return;
  }

  const bDoc = await getDoc(doc(db, 'bookings', bookingId));
  if (bDoc.exists()) {
    const b = bDoc.data();
    document.getElementById('chat-booking-type').textContent = b.type?.replace('_', ' ') || 'Booking';
    document.getElementById('chat-booking-info').textContent = `${b.location || ''} · ${b.date || ''} at ${b.time || ''}`;
  }

  loadMessages();
});

const loadMessages = () => {
  if (unsubscribe) unsubscribe();
  const q = query(collection(db, 'bookings', bookingId, 'messages'), orderBy('createdAt', 'asc'));
  unsubscribe = onSnapshot(q, (snap) => {
    const el = document.getElementById('messages');
    if (snap.empty) {
      el.innerHTML = '<div class="system-msg">No messages yet. Say hello to your Havoc.</div>';
      return;
    }
    el.innerHTML = '';
    snap.forEach(d => {
      const m = d.data();
      const isMine = m.senderId === currentUser?.uid;
      const time = m.createdAt?.toDate?.()?.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) || '';
      el.innerHTML += `
        <div class="message ${isMine ? 'mine' : 'theirs'}">
          ${!isMine ? `<div class="msg-sender">${m.senderName || 'Havoc'}</div>` : ''}
          <div class="msg-bubble">${escapeHtml(m.text)}</div>
          <div class="msg-time">${time}</div>
        </div>`;
    });
    el.scrollTop = el.scrollHeight;
  });
};

window.sendMessage = async () => {
  const input = document.getElementById('msg-input');
  const text = input.value.trim();
  if (!text || !currentUser || !bookingId) return;
  input.value = '';
  input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;
  try {
    await addDoc(collection(db, 'bookings', bookingId, 'messages'), {
      text, senderId: currentUser.uid,
      senderName: currentUserName,
      createdAt: serverTimestamp()
    });
  } catch(e) { console.error(e); }
  document.getElementById('send-btn').disabled = false;
};

window.handleKey = (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
};

window.autoResize = (el) => {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
};

const escapeHtml = (text) => text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
</script>

</body>
</html>
