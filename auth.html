<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HAVOC — Sign In</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: #080808; font-family: 'Inter', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; flex-direction: column; }

.nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 40px; border-bottom: 1px solid rgba(255,255,255,0.07); }
.nav-logo { font-size: 22px; font-weight: 800; letter-spacing: 0.25em; color: #fff; border: 2px solid #fff; padding: 4px 12px; line-height: 1; text-decoration: none; }
.nav-back { font-size: 12px; color: rgba(255,255,255,0.4); text-decoration: none; display: flex; align-items: center; gap: 6px; }

.main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px 20px; }
.card { width: 100%; max-width: 420px; }

.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: rgba(255,255,255,0.06); margin-bottom: 2px; }
.tab { padding: 14px; font-size: 12px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; text-align: center; cursor: pointer; color: rgba(255,255,255,0.35); background: #0e0e0e; transition: all 0.2s; }
.tab.active { background: #fff; color: #080808; }

.form-panel { background: #0e0e0e; border: 1px solid rgba(255,255,255,0.06); padding: 36px; display: none; }
.form-panel.active { display: block; }

.role-toggle { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: rgba(255,255,255,0.06); margin-bottom: 28px; }
.role-btn { padding: 10px; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; text-align: center; cursor: pointer; color: rgba(255,255,255,0.35); background: #141414; transition: all 0.2s; border: none; font-family: 'Inter', sans-serif; }
.role-btn.active { background: rgba(255,255,255,0.1); color: #fff; }

.form-title { font-size: 22px; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 6px; }
.form-sub { font-size: 12px; color: rgba(255,255,255,0.4); margin-bottom: 28px; line-height: 1.6; }

.field { margin-bottom: 14px; }
.field label { display: block; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.35); margin-bottom: 7px; }
.field input { width: 100%; background: #1a1a1a; border: 1px solid rgba(255,255,255,0.1); color: #fff; font-family: 'Inter', sans-serif; font-size: 13px; padding: 12px 14px; outline: none; border-radius: 0; transition: border-color 0.2s; }
.field input:focus { border-color: rgba(255,255,255,0.4); }
.field input::placeholder { color: rgba(255,255,255,0.2); }

.submit-btn { width: 100%; background: #fff; color: #080808; font-family: 'Inter', sans-serif; font-weight: 800; font-size: 13px; letter-spacing: 0.06em; padding: 14px; border: none; cursor: pointer; text-transform: uppercase; margin-top: 6px; transition: opacity 0.2s; }
.submit-btn:hover { opacity: 0.88; }
.submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.divider { display: flex; align-items: center; gap: 14px; margin: 20px 0; }
.divider-line { flex: 1; height: 1px; background: rgba(255,255,255,0.08); }
.divider-text { font-size: 11px; color: rgba(255,255,255,0.25); }

.google-btn { width: 100%; background: #1a1a1a; border: 1px solid rgba(255,255,255,0.1); color: #fff; font-family: 'Inter', sans-serif; font-weight: 600; font-size: 13px; padding: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; transition: border-color 0.2s; }
.google-btn:hover { border-color: rgba(255,255,255,0.3); }

.error-msg { background: rgba(255,60,60,0.1); border: 1px solid rgba(255,60,60,0.3); color: rgba(255,120,120,1); font-size: 12px; padding: 12px 14px; margin-bottom: 16px; display: none; line-height: 1.5; }
.error-msg.show { display: block; }
.success-msg { background: rgba(60,255,120,0.08); border: 1px solid rgba(60,255,120,0.2); color: rgba(100,255,150,1); font-size: 12px; padding: 12px 14px; margin-bottom: 16px; display: none; line-height: 1.5; }
.success-msg.show { display: block; }

.forgot { text-align: right; margin-top: -8px; margin-bottom: 16px; }
.forgot a { font-size: 11px; color: rgba(255,255,255,0.35); text-decoration: none; }
.forgot a:hover { color: rgba(255,255,255,0.7); }

.loading { display: none; }
.loading.show { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(0,0,0,0.3); border-top-color: #080808; border-radius: 50%; animation: spin 0.7s linear infinite; margin-right: 8px; vertical-align: middle; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-logo">HAVOC</a>
  <a href="/" class="nav-back"><i class="ti ti-arrow-left"></i> Back</a>
</nav>

<div class="main">
  <div class="card">

    <div class="tabs">
      <div class="tab active" onclick="switchTab('signin')">Sign in</div>
      <div class="tab" onclick="switchTab('signup')">Create account</div>
    </div>

    <!-- SIGN IN -->
    <div class="form-panel active" id="panel-signin">
      <div class="role-toggle">
        <button class="role-btn active" onclick="setRole('client', this)">I need presence</button>
        <button class="role-btn" onclick="setRole('havoc', this)">I'm a Havoc</button>
      </div>
      <div class="form-title" id="signin-title">Welcome back.</div>
      <div class="form-sub" id="signin-sub">Sign in to book your next Havoc.</div>
      <div class="error-msg" id="signin-error"></div>
      <div class="success-msg" id="signin-success"></div>
      <div class="field"><label>Email</label><input type="email" id="signin-email" placeholder="your@email.com"></div>
      <div class="field"><label>Password</label><input type="password" id="signin-password" placeholder="Your password"></div>
      <div class="forgot"><a href="#" onclick="forgotPassword()">Forgot password?</a></div>
      <button class="submit-btn" onclick="signIn()"><span class="loading" id="signin-loading"></span>Sign in</button>
      <div class="divider"><div class="divider-line"></div><div class="divider-text">or</div><div class="divider-line"></div></div>
      <button class="google-btn" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/><path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/><path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/><path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.31z"/></svg>
        Continue with Google
      </button>
    </div>

    <!-- SIGN UP -->
    <div class="form-panel" id="panel-signup">
      <div class="role-toggle">
        <button class="role-btn active" onclick="setRole('client', this)">I need presence</button>
        <button class="role-btn" onclick="setRole('havoc', this)">I'm a Havoc</button>
      </div>
      <div class="form-title" id="signup-title">Create your account.</div>
      <div class="form-sub" id="signup-sub">Book presence anywhere in the world.</div>
      <div class="error-msg" id="signup-error"></div>
      <div class="success-msg" id="signup-success"></div>
      <div class="field"><label>Full name</label><input type="text" id="signup-name" placeholder="First and last name"></div>
      <div class="field"><label>Email</label><input type="email" id="signup-email" placeholder="your@email.com"></div>
      <div class="field"><label>Password</label><input type="password" id="signup-password" placeholder="Min 8 characters"></div>
      <button class="submit-btn" onclick="signUp()"><span class="loading" id="signup-loading"></span>Create account</button>
      <div class="divider"><div class="divider-line"></div><div class="divider-text">or</div><div class="divider-line"></div></div>
      <button class="google-btn" onclick="signInWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M16.51 8H8.98v3h4.3c-.18 1-.74 1.48-1.6 2.04v2.01h2.6a7.8 7.8 0 0 0 2.38-5.88c0-.57-.05-.66-.15-1.18z"/><path fill="#34A853" d="M8.98 17c2.16 0 3.97-.72 5.3-1.94l-2.6-2a4.8 4.8 0 0 1-7.18-2.54H1.83v2.07A8 8 0 0 0 8.98 17z"/><path fill="#FBBC05" d="M4.5 10.52a4.8 4.8 0 0 1 0-3.04V5.41H1.83a8 8 0 0 0 0 7.18l2.67-2.07z"/><path fill="#EA4335" d="M8.98 4.18c1.17 0 2.23.4 3.06 1.2l2.3-2.3A8 8 0 0 0 1.83 5.4L4.5 7.49a4.77 4.77 0 0 1 4.48-3.31z"/></svg>
        Continue with Google
      </button>
    </div>

  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc, getDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCO7B3n_L-hZj9kHAqNTS8gaDFtCRz4ESM",
  authDomain: "havoc-ae499.firebaseapp.com",
  projectId: "havoc-ae499",
  storageBucket: "havoc-ae499.firebasestorage.app",
  messagingSenderId: "233766682734",
  appId: "1:233766682734:web:a4cc2c0542333fb21ca67f",
  measurementId: "G-G20780L1N1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentRole = 'client';

window.setRole = (role, btn) => {
  currentRole = role;
  document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
  // activate both buttons with same role in both panels
  document.querySelectorAll('.role-btn').forEach(b => {
    if ((role === 'client' && b.textContent.includes('need')) || 
        (role === 'havoc' && b.textContent.includes("Havoc"))) {
      b.classList.add('active');
    }
  });
  const titles = {
    client: { title: 'Welcome back.', sub: 'Sign in to book your next Havoc.' },
    havoc: { title: 'Welcome back, Havoc.', sub: 'Sign in to manage your bookings and earnings.' }
  };
  const supTitles = {
    client: { title: 'Create your account.', sub: 'Book presence anywhere in the world.' },
    havoc: { title: 'Join the roster.', sub: 'Apply to become a verified Havoc.' }
  };
  if (document.getElementById('signin-title')) {
    document.getElementById('signin-title').textContent = titles[role].title;
    document.getElementById('signin-sub').textContent = titles[role].sub;
    document.getElementById('signup-title').textContent = supTitles[role].title;
    document.getElementById('signup-sub').textContent = supTitles[role].sub;
  }
};

window.switchTab = (tab) => {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.form-panel').forEach(p => p.classList.remove('active'));
  document.querySelector(`.tab:${tab === 'signin' ? 'first-child' : 'last-child'}`).classList.add('active');
  document.getElementById(`panel-${tab}`).classList.add('active');
};

const showError = (id, msg) => {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 5000);
};

const showSuccess = (id, msg) => {
  const el = document.getElementById(id);
  el.textContent = msg;
  el.classList.add('show');
};

const setLoading = (id, loading) => {
  document.getElementById(id).classList.toggle('show', loading);
};

const redirectAfterAuth = (role) => {
  if (role === 'havoc') {
    window.location.href = '/havoc-dashboard.html';
  } else {
    window.location.href = '/client-dashboard.html';
  }
};

window.signIn = async () => {
  const email = document.getElementById('signin-email').value;
  const password = document.getElementById('signin-password').value;
  if (!email || !password) return showError('signin-error', 'Please enter your email and password.');
  setLoading('signin-loading', true);
  try {
    const cred = await signInWithEmailAndPassword(auth, email, password);
    const userDoc = await getDoc(doc(db, 'users', cred.user.uid));
    const role = userDoc.exists() ? userDoc.data().role : currentRole;
    redirectAfterAuth(role);
  } catch (e) {
    setLoading('signin-loading', false);
    showError('signin-error', e.code === 'auth/invalid-credential' ? 'Invalid email or password.' : e.message);
  }
};

window.signUp = async () => {
  const name = document.getElementById('signup-name').value;
  const email = document.getElementById('signup-email').value;
  const password = document.getElementById('signup-password').value;
  if (!name || !email || !password) return showError('signup-error', 'Please fill in all fields.');
  if (password.length < 8) return showError('signup-error', 'Password must be at least 8 characters.');
  setLoading('signup-loading', true);
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, password);
    await setDoc(doc(db, 'users', cred.user.uid), {
      name, email, role: currentRole,
      createdAt: serverTimestamp(),
      status: currentRole === 'havoc' ? 'pending' : 'active'
    });
    redirectAfterAuth(currentRole);
  } catch (e) {
    setLoading('signup-loading', false);
    showError('signup-error', e.code === 'auth/email-already-in-use' ? 'An account with this email already exists.' : e.message);
  }
};

window.signInWithGoogle = async () => {
  try {
    const cred = await signInWithPopup(auth, provider);
    const userRef = doc(db, 'users', cred.user.uid);
    const userDoc = await getDoc(userRef);
    if (!userDoc.exists()) {
      await setDoc(userRef, {
        name: cred.user.displayName,
        email: cred.user.email,
        role: currentRole,
        createdAt: serverTimestamp(),
        status: currentRole === 'havoc' ? 'pending' : 'active'
      });
    }
    const role = userDoc.exists() ? userDoc.data().role : currentRole;
    redirectAfterAuth(role);
  } catch (e) {
    showError('signin-error', 'Google sign-in failed. Please try again.');
  }
};

window.forgotPassword = async () => {
  const email = document.getElementById('signin-email').value;
  if (!email) return showError('signin-error', 'Enter your email address first.');
  try {
    await sendPasswordResetEmail(auth, email);
    showSuccess('signin-success', 'Password reset email sent. Check your inbox.');
  } catch (e) {
    showError('signin-error', 'Could not send reset email. Check your email address.');
  }
};
</script>

</body>
</html>
